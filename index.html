<div id="big">

    <div class="bt hl">
      <button class="btn" data-a="close">Close</button>

    </div>
    <div class="bm">
      <div class="artw"><img id="bArt" alt=""></div>

        <div class="ti">

        </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="app.js"></script>
<script>
/* ---------- Online lyrics (LRCLIB) ---------- */
const lyrTried = new Set();
const stripLrc = t => t.replace(/^\[[^\]]*\]\s?/gm, '').trim();

async function fetchLyrics(s) {
  const artist = s.artist.split(/\s*[;\/]\s*/)[0];
  const p = new URLSearchParams({ track_name: s.title, artist_name: artist });
  if (s.album && s.album !== 'Unknown Album') p.set('album_name', s.album);
  if (s.dur) p.set('duration', Math.round(s.dur));
  try {
    let r = await fetch('https://lrclib.net/api/get?' + p);
    let d = r.ok ? await r.json() : null;
    if (!d) {
      r = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(s.title + ' ' + artist));
      d = r.ok ? (await r.json())[0] : null;
    }
    if (!d) return '';
    return (d.plainLyrics || (d.syncedLyrics ? stripLrc(d.syncedLyrics) : '') || '').trim();
  } catch { return ''; }
}

const _ui = ui;
ui = function () {
  _ui();
  const s = cur;
  if (!s || s.lyrics || lyrTried.has(s.id)) return;
  lyrTried.add(s.id);
  $('#lt').textContent = 'Searching for lyrics...';
  fetchLyrics(s).then(txt => {
    if (txt) { s.lyrics = txt; put('songs', s); }
    if (cur && cur.id === s.id) $('#lt').textContent = txt || 'No lyrics found for this song.';
  });
};
</script>
  <script>
/* ---------- Playlist: search + multi-select add ---------- */
const pSelStyle = document.createElement('style');
pSelStyle.textContent = `
.mlist.sel{max-height:50vh;overflow:auto;margin:12px 0}
.row.sel .ck{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;flex:none;color:transparent;transition:.15s}
.row.sel.on .ck{background:var(--acc);border-color:var(--acc);color:#000}
.row.sel.on{background:rgba(255,255,255,.08)}
.row.sel.dis{opacity:.55;cursor:default}
.btn:disabled{opacity:.4;pointer-events:none}
`;
document.head.appendChild(pSelStyle);

let pSel = new Set();
const CK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

const selRows = q => {
  const p = cp();
  return songs.filter(s => match(s, q)).map(s => {
    const inPl = p.songs.includes(s.id), on = inPl || pSel.has(s.id);
    return `<div class="row sel ${on ? 'on' : ''} ${inPl ? 'dis' : ''}" data-a="psel" data-id="${s.id}">
      <span class="ck">${CK}</span><img src="${cover(s)}" alt="">
      <div class="rm"><div><b>${esc(s.title)}</b></div><span>${esc(s.artist)}</span></div>
      ${inPl ? '<em class="dur">In playlist</em>' : ''}</div>`;
  }).join('') || '<p style="opacity:.6;text-align:center">No songs found.</p>';
};

const selCount = () => {
  const b = $('#pcommit'); if (!b) return;
  b.textContent = pSel.size ? `Add ${pSel.size} song${pSel.size > 1 ? 's' : ''}` : 'Add songs';
  b.disabled = !pSel.size;
};

Object.assign(A, {
  padd: () => {
    pSel = new Set();
    mod(`<h3>Add songs</h3>
      <input id="ms2" type="search" placeholder="Search songs, artists, albums">
      <div id="mres" class="mlist sel">${selRows('')}</div>
      <div class="mrow">
        <button class="btn" data-a="mx">Cancel</button>
        <button class="btn" data-a="psall">Select all shown</button>
        <button class="btn pri" id="pcommit" data-a="pcommit" disabled>Add songs</button>
      </div>`);
    $('#ms2').focus();
  },
  psel: (b, id) => {
    if (b.classList.contains('dis')) return;
    pSel.has(id) ? pSel.delete(id) : pSel.add(id);
    b.classList.toggle('on', pSel.has(id));
    selCount();
  },
  psall: () => {
    const shown = [...document.querySelectorAll('#mres .row.sel:not(.dis)')];
    const all = shown.every(r => pSel.has(r.dataset.id));   // toggle: all selected -> clear them
    shown.forEach(r => { all ? pSel.delete(r.dataset.id) : pSel.add(r.dataset.id); r.classList.toggle('on', !all); });
    selCount();
  },
  pcommit: async () => {
    const p = cp(); if (!p || !pSel.size) return;
    pSel.forEach(id => { if (!p.songs.includes(id)) p.songs.push(id); });
    await put('playlists', p);
    pSel = new Set();
    closeMod(); render();
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'ms2') $('#mres').innerHTML = selRows(e.target.value.toLowerCase().trim());
});
  </script>
  <script>
/* ---------- Synced lyrics (LRCLIB) ---------- */
const lyrStyle = document.createElement('style');
lyrStyle.textContent = `
#lt.sy{padding:25vh 0}
#lt .ll{display:block;padding:5px 0;opacity:.35;cursor:pointer;transform-origin:left center;transition:opacity .25s,transform .25s,color .25s}
#lt .ll:hover{opacity:.7}
#lt .ll.on{opacity:1;color:var(--acc);transform:scale(1.04)}
`;
document.head.appendChild(lyrStyle);

const lyrTried = new Set();
let lines = [], active = -1, holdUntil = 0;

function parseLrc(t) {
  const out = [];
  t.split(/\r?\n/).forEach(line => {
    const ts = [...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if (!ts.length) return;
    const x = line.replace(/\[[^\]]*\]/g, '').trim();
    ts.forEach(m => out.push({ t: +m[1] * 60 + +m[2], x }));
  });
  return out.sort((a, b) => a.t - b.t);
}

async function fetchLyrics(s) {
  const artist = s.artist.split(/\s*[;\/]\s*/)[0];
  const p = new URLSearchParams({ track_name: s.title, artist_name: artist });
  if (s.album && s.album !== 'Unknown Album') p.set('album_name', s.album);
  if (s.dur) p.set('duration', Math.round(s.dur));
  try {
    let r = await fetch('https://lrclib.net/api/get?' + p);
    let d = r.ok ? await r.json() : null;
    if (!d || !d.syncedLyrics) {
      r = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(s.title + ' ' + artist));
      const arr = r.ok ? await r.json() : [];
      d = arr.find(x => x.syncedLyrics) || d || arr[0] || null;
    }
    if (!d) return {};
    return {
      synced: d.syncedLyrics || '',
      plain: (d.plainLyrics || (d.syncedLyrics || '').replace(/^\[[^\]]*\]\s?/gm, '')).trim()
    };
  } catch { return { failed: true }; }
}

function showLyrics(s, msg) {
  const lt = $('#lt');
  lines = s && s.synced ? parseLrc(s.synced) : [];
  active = -1;
  lt.classList.toggle('sy', lines.length > 0);
  if (lines.length) {
    lt.innerHTML = lines.map((l, i) => `<span class="ll" data-i="${i}">${esc(l.x) || '&#9834;'}</span>`).join('');
    syncLyrics(true);
  } else {
    lt.textContent = s ? (s.lyrics || msg || 'No lyrics found for this song.') : '';
  }
}

function centerLine(el, instant) {
  const c = $('#lyr');
  const top = el.getBoundingClientRect().top - c.getBoundingClientRect().top + c.scrollTop - c.clientHeight / 2 + el.offsetHeight / 2;
  c.scrollTo({ top, behavior: instant ? 'auto' : 'smooth' });
}

function syncLyrics(jump) {
  if (!lines.length) return;
  const t = au.currentTime + 0.15;
  let i = -1;
  for (let k = 0; k < lines.length && lines[k].t <= t; k++) i = k;
  if (i === active && !jump) return;
  const els = $('#lt').children;
  els[active]?.classList.remove('on');
  active = i;
  const el = els[i];
  if (!el) return;
  el.classList.add('on');
  const open = $('#big').classList.contains('lyr');
  if (jump ? open : (open && Date.now() > holdUntil)) centerLine(el, jump);
}

/* hook into the player */
const _ui = ui;
ui = function () {
  _ui();
  const s = cur;
  showLyrics(s);
  if (!s || s.synced || s.syncTried || lyrTried.has(s.id)) return;
  lyrTried.add(s.id);
  if (!s.lyrics) $('#lt').textContent = 'Searching for lyrics...';
  fetchLyrics(s).then(r => {
    if (r.synced) s.synced = r.synced;
    if (!s.lyrics && r.plain) s.lyrics = r.plain;
    if (!r.failed) s.syncTried = true;     // network error = try again next time
    put('songs', s);                        // cache in IndexedDB
    if (cur && cur.id === s.id) showLyrics(s);
  });
};

au.addEventListener('timeupdate', () => syncLyrics());
au.addEventListener('seeked', () => syncLyrics());

/* snap to the current line when the lyrics panel opens */
const _lyr = A.lyr;
A.lyr = (...a) => { _lyr(...a); requestAnimationFrame(() => syncLyrics(true)); };

/* tap a line to seek; manual scrolling pauses auto-scroll for 3s */
document.addEventListener('click', e => {
  const l = e.target.closest('#lt .ll');
  if (l && lines[+l.dataset.i]) { au.currentTime = lines[+l.dataset.i].t; syncLyrics(); }
});
['wheel', 'touchmove'].forEach(ev =>
  $('#lyr').addEventListener(ev, () => { holdUntil = Date.now() + 3000; }, { passive: true }));
  </script>
  <script>
/* ---------- Repeat modes: off -> all -> one -> once ---------- */
let repOnceUsed = false;

/* every new track gets a fresh "once" */
const _loadRep = load;
load = function () { repOnceUsed = false; return _loadRep.apply(this, arguments); };

/* what happens when a song ends */
au.onended = () => {
  if (S.rep === 2) { au.currentTime = 0; start(); }                                     // repeat one (loop)
  else if (S.rep === 3 && !repOnceUsed) { repOnceUsed = true; au.currentTime = 0; start(); }  // repeat once
  else if ((S.rep === 0 || S.rep === 3) && !S.shuf && qi === queue.length - 1) pi();    // end of queue: stop
  else next();
};

/* the Repeat button (and the R key) cycle through 4 modes */
A.rep = () => { S.rep = (S.rep + 1) % 4; repOnceUsed = false; save('S', S); modes(); };

/* button label */
const _modesRep = modes;
modes = function () {
  _modesRep();
  $('#bRep').textContent = 'Repeat: ' + ['off', 'all', 'one', 'once'][S.rep];
};
modes();
  </script>
